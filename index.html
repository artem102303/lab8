<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тарифні плани</title>
    <link rel="stylesheet" href="pricing.css">
</head>
<body>

<section class="pricing-section">
    <h2>Тарифні плани</h2>

    <div class="pricing-grid">

        <div class="pricing-card">
            <h3>Базовий</h3>
            <div class="price">299 грн</div>

            <ul>
                <li>1 користувач</li>
                <li>10 ГБ пам'яті</li>
                <li>Email підтримка</li>
            </ul>

            <button class="cta-button">Обрати</button>
        </div>

        <div class="pricing-card">
            <h3>Стандарт</h3>
            <div class="price">599 грн</div>

            <ul>
                <li>5 користувачів</li>
                <li>50 ГБ пам'яті</li>
                <li>Пріоритетна підтримка</li>
            </ul>

            <button class="cta-button">Обрати</button>
        </div>

        <div class="pricing-card">
            <h3>Преміум</h3>
            <div class="price">999 грн</div>

            <ul>
                <li>Необмежено користувачів</li>
                <li>1 ТБ пам'яті</li>
                <li>Підтримка 24/7</li>
            </ul>

            <button class="cta-button">Обрати</button>
        </div>

    </div>
</section>

</body>
</html>
